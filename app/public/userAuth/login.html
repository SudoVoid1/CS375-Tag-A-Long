<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | Tag-A-Long</title>
    <link rel="stylesheet" href="/css/water.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/userAuth/css/auth.css" />
    <link rel="stylesheet" href="/css/navigation.css" />
  </head>
  <body>
    <header class="site-header">
      <nav id="site-nav"></nav>
    </header>

    <main class="auth-wrapper">
      <form id="login-form" class="card" novalidate>
        <h1>Log In</h1>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />

        <p id="login-error" class="error" role="alert"></p>

        <button type="submit" class="btn btn-full">Log In</button>
        <p class="small">Don't have an account? <a href="/signup">Sign up</a></p>
      </form>
    </main>

    <script src="/js/navigation.js"></script>
    <script src="/userAuth/js/login.js"></script>
  </body>
</html>
