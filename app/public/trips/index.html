<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Trips</title>
    <link rel="stylesheet" href="trip-style.css" />
  </head>
  <body>
    <h1>My Trips</h1>

    <table id="trips-table">
      <tr>
        <th>Name</th>
        <th>From</th>
        <th>To</th>
        <th>Start</th>
        <th>End</th>
      </tr>
    </table>

    <script>
      const tripsTable = document.getElementById("trips-table");

      fetch("/api/trips?userId=1")
        .then((response) => response.json())
        .then((trips) => {
          trips.forEach((trip) => {
            let row = document.createElement("tr");

            ["tripname", "startlocation", "endlocation", "startdatetime", "enddatetime"].forEach((field) => {
              let cell = document.createElement("td");
              if (field === "tripname") {
                let link = document.createElement("a");
                link.href = `/trips/${trip.tripid}`;
                link.textContent = trip.tripname;
                cell.appendChild(link);
              } else {
                cell.textContent = trip[field];
              }
              row.appendChild(cell);
            });

            tripsTable.appendChild(row);
          });
        })
        .catch((error) => console.log(error));
    </script>
  </body>
</html>
