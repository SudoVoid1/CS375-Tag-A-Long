<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Trips</title>
    <link rel="stylesheet" href="/css/water.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/trips/css/trip-style.css" />
    <link rel="stylesheet" href="/css/navigation.css" />
    <link rel="stylesheet" href="/css/accountOptions.css" />
  </head>
  <body>
    <header class="site-header">
      <nav id="site-nav"></nav>
      <div id="account-options"></div>
    </header>
    <h1>My Trips</h1>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>From</th>
          <th>To</th>
          <th>Start</th>
          <th>End</th>
        </tr>
      </thead>
      <tbody id="trips-table"></tbody>
    </table>

    <h2>Add a trip</h2>
    <div class="form-row">
      <div class="field">
        <label for="name">Trip name</label>
        <input id="name" />
      </div>
      <div class="field">
        <label for="start-location">From</label>
        <select id="start-location"></select>
      </div>
      <div class="field">
        <label for="end-location">To</label>
        <select id="end-location"></select>
      </div>
      <div class="field">
        <label for="start-date">Start</label>
        <input id="start-date" type="datetime-local" />
      </div>
      <div class="field">
        <label for="end-date">End</label>
        <input id="end-date" type="datetime-local" />
      </div>
      <button id="submit-button">Add trip</button>
    </div>
    <p id="message"></p>

    <script src="/js/navigation.js"></script>
    <script src="/js/accountOptions.js"></script>
    <script src="/trips/tripsDashboard.js"></script>
  </body>
</html>
