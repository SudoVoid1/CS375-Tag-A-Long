<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Trips</title>
    <link rel="stylesheet" href="/css/water.css" />
    <link rel="stylesheet" href="/trips/trip-style.css" />
  </head>
  <body>
    <h1>My Trips</h1>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>From</th>
          <th>To</th>
          <th>Start</th>
          <th>End</th>
        </tr>
      </thead>
      <tbody id="trips-table"></tbody>
    </table>

    <h2>Add a trip</h2>
    <label for="name">Trip name</label>
    <input id="name" />

    <label for="start-location">From</label>
    <select id="start-location"></select>

    <label for="end-location">To</label>
    <select id="end-location"></select>

    <label for="start-date">Start</label>
    <input id="start-date" type="datetime-local" />

    <label for="end-date">End</label>
    <input id="end-date" type="datetime-local" />

    <button id="submit-button">Add trip</button>
    <p id="message"></p>

    <script src="/trips/tripsDashboard.js"></script>
  </body>
</html>
