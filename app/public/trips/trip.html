<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trip</title>
    <link rel="stylesheet" href="/trips/trip-style.css" />
  </head>
  <body>
    <h1 id="name">Trip:</h1>

    <nav>
      <a href="#" data-section="travel">Travel</a>
      <a href="#" data-section="budget">Budget</a>
      <a href="#" data-section="itinerary">Itinerary</a>
      <a href="#" data-section="notes">Notes</a>
    </nav>

    <main>
      <section id="travel">
        <h2>Travel</h2>

            <th>Name</th>
            <th>From</th>
            <th>To</th>
            <th>Start</th>
            <th>End</th>

        </table>

      <section id="budget">
        <h2>Budget</h2>
      </section>

      <section id="itinerary">
        <h2>Itinerary</h2>
      </section>

      <section id="notes">
        <h2>Notes</h2>
      </section>
    </main>

    <script src="/trips/trips.js"></script>

</html>
