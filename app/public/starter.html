<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan your trip!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <label for="startLoc">From</label>
    <input type="text" id="startLoc" name="startLocation" autocomplete="startLocation" required>
    <label for="startDate">Date</label>
    <input type="date" id="startDate" name="startDate" autocomplete="startDate" required>

    <label for="endLoc">To</label>
    <input type="text" id="endLoc" name="endLoc" autocomplete="endLoc" required>
    <label for="endDate">Date</label>
    <input type="date" id="endDate" name="endDate" autocomplete="endDate" required>

</body>
</html>
